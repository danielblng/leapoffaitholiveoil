backend:
  name: github
  repo: black-rook-digital/leap-of-faith   # <-- change to the real GitHub owner/repo
  branch: main
  base_url: https://sveltia-cms-auth.danielblng.workers.dev

media_folder: "src/assets"
public_folder: "/assets"

collections:
  - name: content
    label: "Website Content"
    editor:
      preview: false
    files:
      - name: home
        label: "Home Page"
        file: "src/_data/home.json"
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Eyebrow (location line)", name: eyebrow, widget: string }
              - { label: "Sub-line", name: sub, widget: string }
              - { label: "Tagline", name: tagline, widget: text }
          - label: "Story"
            name: story
            widget: object
            fields:
              - { label: "Heading", name: title, widget: string }
              - { label: "Body", name: body, widget: markdown }
              - { label: "Signature name", name: signature, widget: string }
              - { label: "Signature location", name: signatureMeta, widget: string }
              - { label: "Photo", name: image, widget: image }
              - { label: "Photo alt text", name: imageAlt, widget: string }
              - { label: "Photo caption", name: caption, widget: string }
          - label: "The Oil"
            name: oil
            widget: object
            fields:
              - { label: "Heading", name: title, widget: string }
              - { label: "Tasting notes", name: notes, widget: text }
              - { label: "Notes sub-line", name: notesSub, widget: text }
              - { label: "Photo", name: image, widget: image }
              - { label: "Photo alt text", name: imageAlt, widget: string }
          - label: "The Place"
            name: place
            widget: object
            fields:
              - { label: "Heading", name: title, widget: string }
              - { label: "Body", name: body, widget: markdown }
          - label: "Enquire"
            name: enquire
            widget: object
            fields:
              - { label: "Heading", name: title, widget: string }
              - { label: "Body", name: body, widget: markdown }
              - { label: "Estate address", name: estate, widget: string }
